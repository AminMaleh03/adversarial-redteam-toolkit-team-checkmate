name: Stage 3 release gate

on:
  pull_request:
    branches: [stage3/integration]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: stage3-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Frozen candidate gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache pinned Hugging Face assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('endpoint/targets.json') }}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run candidate against frozen policy
        id: candidate_gate
        shell: bash
        run: |
          set +e
          python -m runner.gate \
            --policy analysis/policies/ci_core_v1.json \
            --out results/gate \
            --results-root results/gate-runs \
            --run-name "ci-${GITHUB_SHA}" \
            --html-only 2>&1 | tee results/gate.log
          code=${PIPESTATUS[0]}
          echo "$code" > results/gate-exit-code.txt
          exit 0
      - name: Verify tested commit and model pin
        if: always()
        shell: bash
        run: |
          python -c "
          import json, os, pathlib

          gate_result_path = pathlib.Path('results/gate/gate_result.json')
          if not gate_result_path.exists():
              raise SystemExit('gate_result.json was not written; nothing to verify')
          gate_result = json.loads(gate_result_path.read_text())

          # An execution_error before a run ever produced an analysis document (the
          # candidate endpoint never started, the policy itself was unreadable, ...)
          # leaves nothing here to verify -- the gate's own exit code, enforced in the
          # next step, is what fails the job, not this identity check. Check for that
          # first: a genuine execution_error can legitimately carry an empty candidate.
          analysis_path = (gate_result.get('artifacts') or {}).get('analysis_json')
          if not analysis_path or not pathlib.Path(analysis_path).exists():
              print('no analysis.json produced (execution_error before a run existed); skipping identity verification')
              raise SystemExit(0)

          # GateOutcome.candidate is the plain target_id string (contract.py), not a
          # nested identity object -- do not assume a commit/model_revision shape here.
          expected_candidate = 'emotion_v2'
          assert gate_result.get('candidate') == expected_candidate, (
              gate_result.get('candidate'), expected_candidate)

          analysis = json.loads(pathlib.Path(analysis_path).read_text())

          app_commit = analysis['run_identity']['app_commit']
          assert app_commit == os.environ['GITHUB_SHA'], (app_commit, os.environ['GITHUB_SHA'])

          summaries = analysis['evaluations'][0]['summaries']
          observed_revision = summaries[expected_candidate]['identity']['model']['revision']
          targets = json.loads(pathlib.Path('endpoint/targets.json').read_text())
          expected_revision = targets['models']['emotion_distilroberta']['revision']
          assert observed_revision == expected_revision, (observed_revision, expected_revision)

          print(f'verified: commit {app_commit} matches GITHUB_SHA; '
                f'{expected_candidate} model revision {observed_revision} matches the pinned registry')
          "
      - name: Publish gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-gate-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            results/gate/gate_result.json
            results/gate.log
            results/gate-exit-code.txt
            results/gate-runs/**/run.json
            results/gate-runs/**/registry.json
            results/gate-runs/**/case_selection.json
            results/gate-runs/**/results.jsonl
            results/gate-runs/**/run_meta.json
            results/gate-runs/**/manifest.json
            results/gate-runs/**/analysis.json
            results/gate-runs/**/report.html
      - name: Enforce gate outcome
        if: always()
        shell: bash
        run: |
          code=$(cat results/gate-exit-code.txt 2>/dev/null || echo 2)
          test "$code" -eq 0

  deploy:
    name: Deploy tested release to Hugging Face Space
    needs: gate
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    environment: huggingface
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require release configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        shell: bash
        run: |
          test -n "$HF_TOKEN" || { echo "Missing environment secret HF_TOKEN"; exit 2; }
          test -n "$HF_SPACE_ID" || { echo "Missing environment variable HF_SPACE_ID"; exit 2; }
      - name: Publish this tested commit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          python -m pip install "huggingface_hub==0.27.1"
          python -c "import os; from huggingface_hub import HfApi; HfApi(token=os.environ['HF_TOKEN']).upload_folder(repo_id=os.environ['HF_SPACE_ID'], repo_type='space', folder_path='.', ignore_patterns=['.git/**','results/**','.venv/**','__pycache__/**'], commit_message='Deploy tested GitHub commit ${{ github.sha }}')"
